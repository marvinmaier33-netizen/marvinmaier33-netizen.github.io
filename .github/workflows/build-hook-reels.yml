name: Build two simple hook Reels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-hook-reels.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl

      - name: Download existing Runway footage and music
        run: |
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/wan_3_0/1478c637-2dcf-4dcb-84db-5c1d7f92b3e4/Vertical_faceless_lifestyle_B_roll_for_an_Instagram_Reel__Over_the_shoulder_and_close_up_shots_only_.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDkyMzU5MmNkYWMxMjYyNiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDI5NzI2MH0.enQsW5_DXnDKnOPQJhdg6aupahs8L08E3k0Ss6Pg5IY' -o broll1.mp4
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/wan_3_0/b43ad855-3ef9-41e5-9d4b-6047ea691dbc/Vertical_faceless_POV_lifestyle_video_for_an_Instagram_Reel__First_person_perspective_in_a_bright_mo.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGY3ZTVkZjhmNWFmMTQ1NyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDMwNTY1Nn0.hn-obe5KRm_dDyYBcRo2Cix8oGauqI_J4k5UGoJYFH0' -o broll2.mp4
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/lyria3-clip/a39c5246-1660-4c34-8664-7f9724b3ceae/Einfach_mit_KI___Reel_Background_Bed.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYmY0ZGJkYmVkNWRlNTM1NSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDMzNjcwMn0.dUJPKXISjp5jFNRlMy6AwnVBqfslihMNj19-nDdqzZk' -o music.mp3

      - name: Create hook text files
        run: |
          mkdir -p tmp reels
          printf '%s' 'Du brauchst keine 100 Prompts.\nDu brauchst ein System.' > tmp/hook1.txt
          printf '%s' 'Die meisten nutzen ChatGPT\nim Alltag völlig falsch.' > tmp/hook2.txt

      - name: Build Hook Reel 1
        run: |
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          ffmpeg -y -i broll1.mp4 -stream_loop -1 -i music.mp3 \
            -filter_complex "
              [0:v]scale=1080:1920:flags=lanczos,trim=duration=9,setpts=PTS-STARTPTS,
              eq=brightness=-0.08:saturation=0.93,
              drawbox=x=70:y=610:w=940:h=500:color=black@0.28:t=fill,
              drawtext=fontfile=${FONT}:textfile=tmp/hook1.txt:fontsize=78:line_spacing=24:fontcolor=white:borderw=2:bordercolor=black@0.55:x=(w-text_w)/2:y=(h-text_h)/2,
              format=yuv420p[v];
              [1:a]atrim=duration=9,afade=t=in:st=0:d=0.4,afade=t=out:st=8.2:d=0.8,volume=0.65[a]" \
            -map "[v]" -map "[a]" -r 30 -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k -t 9 -movflags +faststart reels/Hook_Reel_01_System.mp4

      - name: Build Hook Reel 2
        run: |
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          ffmpeg -y -i broll2.mp4 -stream_loop -1 -i music.mp3 \
            -filter_complex "
              [0:v]scale=1080:1920:flags=lanczos,trim=duration=9,setpts=PTS-STARTPTS,
              eq=brightness=-0.08:saturation=0.95,
              drawbox=x=70:y=610:w=940:h=500:color=black@0.28:t=fill,
              drawtext=fontfile=${FONT}:textfile=tmp/hook2.txt:fontsize=76:line_spacing=24:fontcolor=white:borderw=2:bordercolor=black@0.55:x=(w-text_w)/2:y=(h-text_h)/2,
              format=yuv420p[v];
              [1:a]atrim=duration=9,afade=t=in:st=0:d=0.4,afade=t=out:st=8.2:d=0.8,volume=0.65[a]" \
            -map "[v]" -map "[a]" -r 30 -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 192k -t 9 -movflags +faststart reels/Hook_Reel_02_Alltag.mp4

      - name: Commit finished hook Reels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/Hook_Reel_01_System.mp4 reels/Hook_Reel_02_Alltag.mp4
          git commit -m "Add two simple hook reels" || exit 0
          git push
