name: Build Reel 02 v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-reel02-v2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl

      - name: Download natural German voiceover
        run: |
          curl -L --fail --retry 3 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/0509e7eb-eb49-4a6e-bef4-b46b23dbfdae/Einfach_mit_KI___Reel_02_Voiceover_v2.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWI4YmRlMmRmMzg4ZDZmMSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDMwMzY2MX0.Rh6uuPZIEEhBfZs9-_GmfVREelfZautfETc76Ohf-B4' -o voice.mp3

      - name: Create branded Reel visuals
        run: |
          cat > build_reel.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os, subprocess

          W,H=1080,1920
          CREAM="#F6F1E7"; GREEN="#183D32"; ORANGE="#F28C52"; WHITE="#FFFFFF"; PALE="#E8EFEA"; MUTED="#69756F"
          out="reel02_assets"; os.makedirs(out,exist_ok=True)
          fb="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          fr="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          def F(sz,b=True): return ImageFont.truetype(fb if b else fr,sz)
          def pill(d,box,r,fill,outline=None,w=1): d.rounded_rectangle(box,radius=r,fill=fill,outline=outline,width=w)
          def center(d,text,y,font,fill,maxw=820,spacing=14):
              words=text.split(); lines=[]; cur=""
              for word in words:
                  t=(cur+" "+word).strip()
                  if d.textbbox((0,0),t,font=font)[2] <= maxw: cur=t
                  else:
                      if cur: lines.append(cur)
                      cur=word
              if cur: lines.append(cur)
              cy=y
              for line in lines:
                  bb=d.textbbox((0,0),line,font=font); tw=bb[2]-bb[0]; th=bb[3]-bb[1]
                  d.text(((W-tw)/2,cy),line,font=font,fill=fill)
                  cy+=th+spacing
              return cy
          def base():
              im=Image.new("RGB",(W,H),CREAM); d=ImageDraw.Draw(im)
              pill(d,(70,86,360,152),32,PALE)
              d.text((102,103),"EINFACH MIT KI",font=F(29),fill=GREEN)
              d.ellipse((326,112,344,130),fill=ORANGE)
              d.text((760,1760),"@einfachmit.ki",font=F(27,False),fill=MUTED)
              return im,d
          def save_scene(i, title, sub, num=None, kind=None, accent=False):
              im,d=base()
              if num is None:
                  y=440
                  y=center(d,title,y,F(68),GREEN,820,16)
                  center(d,sub,y+18,F(52),ORANGE if accent else GREEN,810,16)
              else:
                  pill(d,(112,300,968,1450),58,WHITE)
                  d.ellipse((172,390,292,510),fill=ORANGE)
                  bb=d.textbbox((0,0),str(num),font=F(52)); d.text((232-(bb[2]-bb[0])/2,445-(bb[3]-bb[1])/2),str(num),font=F(52),fill=WHITE)
                  d.text((338,405),title,font=F(61),fill=GREEN)
                  pill(d,(170,585,910,980),46,PALE)
                  if kind=="calendar":
                      pill(d,(385,660,695,875),36,CREAM,outline=GREEN,w=8)
                      d.rectangle((385,710,695,755),fill=GREEN)
                      for x in (445,540,635): d.ellipse((x-12,805-12,x+12,805+12),fill=ORANGE)
                      d.line((450,645,450,695),fill=GREEN,width=11); d.line((630,645,630,695),fill=GREEN,width=11)
                  elif kind=="cart":
                      d.line((345,730,415,730),fill=GREEN,width=14); d.line((415,730,470,855),fill=GREEN,width=14)
                      d.line((470,855,700,855),fill=GREEN,width=14); d.line((455,770,755,770),fill=GREEN,width=14); d.line((755,770,700,855),fill=GREEN,width=14)
                      d.ellipse((490,880,538,928),fill=ORANGE); d.ellipse((655,880,703,928),fill=ORANGE)
                  elif kind=="scale":
                      d.line((540,665,540,900),fill=GREEN,width=14); d.line((385,725,695,725),fill=GREEN,width=12)
                      d.line((435,725,375,845),fill=GREEN,width=8); d.line((645,725,705,845),fill=GREEN,width=8)
                      d.arc((300,795,450,930),0,180,fill=ORANGE,width=10); d.arc((630,795,780,930),0,180,fill=ORANGE,width=10)
                      d.ellipse((515,870,565,920),fill=GREEN)
                  center(d,sub,1060,F(48,False),GREEN,700,18)
              im.save(f"{out}/s{i}.png")

          save_scene(1,"3 Dinge, die ChatGPT dir","jede Woche abnehmen kann",accent=True)
          save_scene(2,"Wochenplanung","Termine und Prioritäten auf einen Blick.",1,"calendar")
          save_scene(3,"Einkaufsliste","Aus deinem Plan wird direkt eine Liste.",2,"cart")
          save_scene(4,"Entscheidungen","Optionen klar vergleichen statt grübeln.",3,"scale")

          im,d=base()
          center(d,"So nutzt du ChatGPT",455,F(68),GREEN,820,16)
          center(d,"als System",565,F(80),ORANGE,820,16)
          center(d,"statt nur für einzelne Fragen.",710,F(48,False),GREEN,780,16)
          pill(d,(175,1000,905,1170),42,WHITE)
          d.text((270,1053),"klare Workflows",font=F(43),fill=GREEN)
          im.save(f"{out}/s5.png")

          im,d=base()
          pill(d,(125,315,955,1435),60,GREEN)
          center(d,"Kommentiere",520,F(54,False),WHITE,650)
          center(d,"START",640,F(130),ORANGE,650)
          center(d,"und ich schicke dir den Zugang",850,F(47,False),WHITE,700,18)
          center(d,"direkt per DM.",970,F(47),WHITE,700,18)
          pill(d,(245,1190,835,1300),34,CREAM)
          center(d,"Klarer Alltag mit KI",1218,F(35),GREEN,520)
          im.save(f"{out}/s6.png")
          PY
          python build_reel.py

      - name: Render video
        run: |
          ffmpeg -y             -loop 1 -t 3.8 -i reel02_assets/s1.png             -loop 1 -t 3.1 -i reel02_assets/s2.png             -loop 1 -t 3.1 -i reel02_assets/s3.png             -loop 1 -t 3.1 -i reel02_assets/s4.png             -loop 1 -t 3.6 -i reel02_assets/s5.png             -loop 1 -t 5.5 -i reel02_assets/s6.png             -filter_complex "[0:v]scale=1080:1920,format=yuv420p[v0];[1:v]scale=1080:1920,format=yuv420p[v1];[2:v]scale=1080:1920,format=yuv420p[v2];[3:v]scale=1080:1920,format=yuv420p[v3];[4:v]scale=1080:1920,format=yuv420p[v4];[5:v]scale=1080:1920,format=yuv420p[v5];[v0][v1]xfade=transition=fade:duration=0.35:offset=3.45[x1];[x1][v2]xfade=transition=fade:duration=0.35:offset=6.20[x2];[x2][v3]xfade=transition=fade:duration=0.35:offset=8.95[x3];[x3][v4]xfade=transition=fade:duration=0.35:offset=11.70[x4];[x4][v5]xfade=transition=fade:duration=0.35:offset=14.95[vout]"             -map "[vout]" -r 30 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart visuals.mp4

      - name: Add voice and music
        run: |
          mkdir -p reels
          ffmpeg -y -i visuals.mp4 -i voice.mp3             -f lavfi -t 20.1 -i "aevalsrc=0.018*sin(2*PI*110*t)+0.012*sin(2*PI*146.83*t)+0.010*sin(2*PI*164.81*t):s=44100"             -filter_complex "[1:a]highpass=f=80,acompressor=threshold=0.1:ratio=2.5:attack=15:release=180,loudnorm=I=-15:TP=-1.5:LRA=7[voice];[2:a]volume=0.55[music];[music][voice]sidechaincompress=threshold=0.015:ratio=8:attack=10:release=250[duck];[duck][voice]amix=inputs=2:duration=longest:normalize=0[a]"             -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -t 20.1 -movflags +faststart reels/Reel_02_Einfach_mit_KI_v2.mp4

      - name: Commit finished Reel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels/Reel_02_Einfach_mit_KI_v2.mp4
          git commit -m "Add finished Reel 02 v2" || exit 0
          git push
